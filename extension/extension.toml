id = "x509-parser"
name = "X.509 Parser"
description = "Hover and decode X.509 certificates in PEM files (.pem, .crt, .cer, .cert)"
version = "0.1.0"
schema_version = 1
authors = ["Harsha Bachina <hvardhan20@gmail.com>"]
repository = "https://github.com/hvardhan20/zed-x509-parser"

[language_servers.x509-language-server]
name = "X.509 Language Server"
language = "PEM"

[grammars.pem]
repository = "https://github.com/tree-sitter-grammars/tree-sitter-pem"
commit = "e525b177a229b1154fd81bc0691f943028d9e685"
