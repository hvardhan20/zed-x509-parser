[package]
name = "x509-language-server"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "LSP server that decodes X.509 certificates in PEM files"
repository = "https://github.com/hvardhan20/zed-x509-parser"

[dependencies]
lsp-server = "0.7"
lsp-types = "0.97"
serde_json = "1"
x509-parser = "0.16"
oid-registry = "0.7"
sha2 = "0.10"
percent-encoding = "2"
